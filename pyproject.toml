[project]
name = "urdf-inspector"
version = "0.1.0"
description = "拖放 URDF 到自绘窗口查看（MuJoCo 离屏渲染 + Qt）"
requires-python = ">=3.9"
dependencies = [
    "mujoco>=3.1",
    "numpy>=1.22",
    "PySide6-Essentials>=6.5",
]

[project.scripts]
urdf-inspector = "urdf_inspector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["urdf_inspector"]
